<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heaven Loy Krathong | ลอยกระทงบนสวรรค์</title><style>
*{box-sizing:border-box}body{margin:0;color:#fff;font-family:system-ui,sans-serif;background:#100c26;--a:#e9b76b;--b:#69458d}main{max-width:1100px;margin:auto;padding:28px 18px}header{text-align:center;padding:20px}small{letter-spacing:4px;color:var(--a)}h1{font-size:clamp(32px,6vw,65px);margin:12px 0;color:#ffe7b5;text-shadow:0 0 30px var(--a)}p{line-height:1.7} .scene{height:390px;position:relative;overflow:hidden;border-radius:28px;background:radial-gradient(ellipse at 50% 80%,var(--b),transparent 70%),linear-gradient(#08091f,#292044);border:1px solid #ffffff30;isolation:isolate}.moon{position:absolute;left:calc(50% - 54px);top:38px;width:108px;height:108px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#ffe6ae 65%,#e9bd81);box-shadow:0 0 65px #ffe3aa88}.star{position:absolute;background:white;border-radius:50%;animation:twinkle 3s infinite alternate}.cloud{position:absolute;width:75%;height:120px;background:radial-gradient(ellipse,#f8dfff66,transparent 70%);filter:blur(12px);animation:cloud 13s infinite alternate}.water{position:absolute;bottom:0;width:100%;height:36%;background:repeating-linear-gradient(0deg,transparent 0 12px,#fff2 13px,transparent 15px),linear-gradient(transparent,#15142f);transform:perspective(220px) rotateX(22deg);transform-origin:bottom}.palace{position:absolute;bottom:34%;left:50%;transform:translateX(-50%);width:290px;filter:drop-shadow(0 0 12px var(--a));opacity:.9}.scene-label{position:absolute;top:15px;left:20px;background:#130e2c99;padding:8px 15px;border-radius:30px}.float{position:absolute;bottom:4%;left:50%;font-size:55px;animation:sail 9s ease-out forwards;z-index:3;text-shadow:0 0 25px gold}.float span{display:block;font-size:12px;text-align:center;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@keyframes sail{from{transform:translate(-50%,0) scale(1.4)}to{transform:translate(-50%,-100px) scale(.55)}}@keyframes twinkle{to{opacity:.2}}@keyframes cloud{to{transform:translateX(70px)}}.panel{background:#ffffff09;border:1px solid #ffffff20;border-radius:24px;padding:24px;margin-top:18px}.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}button,input,textarea{font:inherit}button{cursor:pointer;color:white;background:#ffffff0c;border:1px solid #ffffff30;border-radius:14px;padding:12px;transition:.2s}button:hover,button.active{border-color:var(--a);background:#ffffff20;box-shadow:0 0 18px #ffffff15}label{display:block;margin:14px 0 7px}input,textarea{width:100%;padding:13px;border:1px solid #ffffff30;background:#100c26;color:white;border-radius:12px}textarea{resize:vertical}.choices{display:flex;flex-wrap:wrap;gap:8px}.primary{width:100%;margin-top:18px;background:linear-gradient(100deg,#e9b76b,#f5c3e9);color:#29132f;font-weight:bold;font-size:19px;border:0}.result{text-align:center;overflow-wrap:anywhere}footer{text-align:center;color:#c4b6d8;font-size:13px;padding:25px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:700px){.layout{grid-template-columns:1fr}.scene{height:320px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style></head><body><main><header><small>✦ CELESTIAL FESTIVAL ✦</small><h1>ลอยกระทงบนสวรรค์</h1><p>ปล่อยเรื่องไม่ปังให้ลอยไป แล้วรับพลังตัวแม่กลับมา ✨</p></header><div class="scene" id="scene"><div class="moon"></div><div class="cloud" style="top:120px;left:-15%"></div><div class="cloud" style="top:190px;right:-10%"></div><svg class="palace" viewBox="0 0 300 150" fill="none" aria-hidden="true"><g fill="#e8bd85" stroke="#fff0c9" stroke-width="1"><path d="M15 145H285V132H15Z M35 132V92H85V132 M215 132V92H265V132 M100 132V65H200V132 M125 65V45H175V65"/><path d="M20 92L60 60L100 92Z M200 92L240 60L280 92Z M85 65L150 20L215 65Z M135 30L150 0L165 30Z"/></g><g fill="#39204f"><path d="M140 132V95Q150 75 160 95V132Z M49 132V105Q60 90 71 105V132Z M229 132V105Q240 90 251 105V132Z"/></g></svg><div class="water"></div><div class="scene-label" id="sceneLabel">✨ จาตุมหาราชิกา</div></div><section class="panel"><h2>01 · เลือกชั้นสวรรค์</h2><div class="levels" id="levels"></div></section><div class="layout"><section class="panel"><h2>02 · กระทงของตัวแม่</h2><div class="choices" id="boats"></div><label for="name">ชื่อผู้ลอยกระทง (ไม่บังคับ)</label><input id="name" maxlength="60" placeholder="ตัวแม่แห่งจักรวาล"><label for="wish">คำอธิษฐาน</label><textarea id="wish" rows="4" maxlength="300" placeholder="ขอให้ชีวิตปังทุกด้าน..."></textarea></section><section class="panel"><h2>03 · คำอวยพรสายปัง</h2><div class="choices" id="wishes"></div><button class="primary" id="launch">🪷 ลอยกระทงขึ้นสวรรค์</button><div class="result" id="result" aria-live="polite"></div><button id="share" hidden style="width:100%;margin-top:10px">แชร์คำอวยพร ✦</button></section></div><footer>HEAVEN LOY KRATHONG · สวรรค์แฟนตาซีเพื่อความบันเทิง · Made for the stars</footer></main><script>
const $=id=>document.getElementById(id);const levels=[['✨','จาตุมหาราชิกา','#e9b76b','#73588b'],['🌙','ดาวดึงส์','#ffe1a0','#3757a0'],['💜','ยามา','#d2a7ff','#7135a4'],['🌸','ดุสิต','#ffc0df','#a83e78'],['💎','นิมมานรดี','#8fffe4','#177f89'],['👑','ปรนิมมิตวสวัตดี','#ffcf80','#6332a0']];let level=0,boat=0;const boats=['🪷','🌸','👑','💎'];let shared='';function selectLevel(i){level=i;let l=levels[i];document.body.style.setProperty('--a',l[2]);document.body.style.setProperty('--b',l[3]);$('sceneLabel').textContent=l[0]+' '+l[1];[...$('levels').children].forEach((b,j)=>{b.classList.toggle('active',i===j);b.setAttribute('aria-pressed',i===j)})}levels.forEach((l,i)=>{let b=document.createElement('button');b.textContent=l[0]+' '+l[1];b.onclick=()=>selectLevel(i);$('levels').append(b)});boats.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v+' '+['บัวทอง','บุปผา','มงกุฎ','คริสตัล'][i];b.onclick=()=>{boat=i;[...$('boats').children].forEach((x,j)=>{x.classList.toggle('active',i===j);x.setAttribute('aria-pressed',i===j)})};$('boats').append(b)});$('boats').children[0].click();selectLevel(0);for(let i=0;i<100;i++){let s=document.createElement('i');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*75}%;width:${1+Math.random()*2}px;height:${1+Math.random()*2}px;animation-delay:${Math.random()*3}s`;$('scene').prepend(s)}const wishes=['เงินเข้ารัว ๆ งานปังไม่พัก 💸','สวย รวย เก่ง เฮง แบบตัวแม่ 👑','รักดี ๆ ไม่ต้องวิ่งตามใคร 💖','สุขภาพดี มีความสุขทุกวัน ✨','ขอให้ทุกความฝันเป็นจริง 🌙','เรื่องร้ายจงลอยไป ความปังจงลอยมา'];wishes.forEach(w=>{let b=document.createElement('button');b.textContent=w;b.onclick=()=>{$('wish').value=w};$('wishes').append(b)});$('launch').onclick=()=>{let wish=$('wish').value.trim();if(!wish){$('wish').focus();$('result').textContent='ใส่คำอธิษฐานก่อนนะตัวแม่ ✨';return}let name=$('name').value.trim()||'ตัวแม่';let f=document.createElement('div');f.className='float';f.textContent=boats[boat]+'🕯️';let t=document.createElement('span');t.textContent=name;f.append(t);$('scene').append(f);setTimeout(()=>f.remove(),18000);$('result').textContent='✨ '+name+' ลอยกระทง ณ '+levels[level][1]+' สำเร็จ! ขอให้ '+wish;let u=new URL(location.href);u.search='';u.searchParams.set('wish',wish);u.searchParams.set('name',name);u.searchParams.set('level',level);u.searchParams.set('boat',boat);shared=u.href;$('share').hidden=false;$('scene').scrollIntoView({behavior:'smooth',block:'center'})};$('share').onclick=async()=>{try{if(navigator.share){await navigator.share({title:'ลอยกระทงบนสวรรค์',text:$('result').textContent,url:shared})}else{await navigator.clipboard.writeText(shared);$('share').textContent='คัดลอกลิงก์แล้ว ✓'}}catch(e){if(e.name!=='AbortError')prompt('คัดลอกลิงก์นี้',shared)}};let q=new URLSearchParams(location.search);if(q.has('wish')){$('wish').value=(q.get('wish')||'').slice(0,300);$('name').value=(q.get('name')||'').slice(0,60);selectLevel(Math.max(0,Math.min(5,parseInt(q.get('level'))||0)));$('boats').children[Math.max(0,Math.min(3,parseInt(q.get('boat'))||0))].click();$('result').textContent='มีคำอวยพรจาก '+($('name').value||'เพื่อน')+' ส่งถึงคุณ ✨'}
</script></body></html>
